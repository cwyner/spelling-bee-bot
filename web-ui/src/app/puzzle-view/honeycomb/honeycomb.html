<svg class="honeycomb" viewBox="-135 -140 270 280">
  @for (hex of hexes; track hex.id) {
    <g
      class="hex"
      [class.center]="hex.id === 'center'"
      [attr.transform]="'translate(' + hex.x + ',' + hex.y + ')'"
    >
      <polygon points="50,0 25,-43.3 -25,-43.3 -50,0 -25,43.3 25,43.3" />

      @if (isEditing()) {
        <foreignObject x="-25" y="-18" width="50" height="36">
          <input
            class="hex-input"
            type="text"
            maxlength="1"
            [value]="hex.letter"
            (focus)="$any($event.target).select()"
            (input)="onLetterChange(hex, $event)"
          />
        </foreignObject>
      } @else {
        <text text-anchor="middle" dominant-baseline="middle">{{ hex.letter }}</text>
      }
    </g>
  }
</svg>
